[build_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
c_args = ['-arch', 'x86_64', '-mmacosx-version-min=12.0']
cpp_args = ['-arch', 'x86_64', '-mmacosx-version-min=12.0']
c_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=12.0']
cpp_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=12.0']
